<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeKid Battery Consumption Benchmark</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chart-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 40px;
      width: 700px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .bar-group {
      margin-bottom: 28px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .bar-track {
      background: #0f172a;
      border-radius: 12px;
      height: 36px;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 3px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      transition: width 1s ease-in-out;
    }
    .fill-baseline {
      width: 90%;
      background: linear-gradient(90deg, #ef4444, #f87171);
    }
    .fill-safekid {
      width: 19%;
      background: linear-gradient(90deg, #10b981, #34d399);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="chart-card">
    <h2>Figure 8.4 - Hardware Battery Profiling Comparison</h2>
    <p class="subtitle">2-Hour Active Location Tracking Session Benchmark (Android Test Device)</p>

    <div class="bar-group">
      <div class="label-row">
        <span>Continuous GPS Polling (Baseline)</span>
        <span style="color: #f87171;">18.0% / hour</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill fill-baseline">18.0% / hr</div>
      </div>
    </div>

    <div class="bar-group">
      <div class="label-row">
        <span>SafeKid Velocity-Based Adaptive Polling</span>
        <span style="color: #34d399;">3.8% / hour</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill fill-safekid">3.8%</div>
      </div>
    </div>

    <div class="badge">
      ⚡ 78.8% Battery Power Reduction Achieved
    </div>
  </div>

</body>
</html>
