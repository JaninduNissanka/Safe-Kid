name: safekid_pro
description: "A new Flutter project for Child Safety."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- FIREBASE CORE ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # --- MAPS & LOCATION ---
  google_maps_flutter: ^2.9.0
  location: ^7.0.0             # <--- ADDED THIS FOR PHASE 2
  
  # --- PERMISSIONS & BACKGROUND ---
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.0

  # --- UTILITIES ---
  easy_localization: ^3.0.3
  phosphor_flutter: ^2.0.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.1.2
  firebase_messaging: ^15.1.3
  http: ^1.2.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  sensors_plus: ^5.0.1
  battery_plus: ^7.0.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/translations/