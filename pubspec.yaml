name: safekid_pro
description: "A new Flutter project for Child Safety."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- FIREBASE CORE ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # --- MAPS & LOCATION ---
  google_maps_flutter: ^2.9.0
  location: ^7.0.0             # <--- ADDED THIS FOR PHASE 2
  
  # --- PERMISSIONS & BACKGROUND ---
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.0

  # --- UTILITIES ---
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
